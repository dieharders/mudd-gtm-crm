<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Nothing leaves this machine: every script, style, image and request is same-origin. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://127.0.0.1:* ws://localhost:*; font-src 'self'"
    />
    <title>Mudd</title>
    <!-- The GENERATED stylesheet (bun run build:css), not styles.css: Tailwind v4 needs its own CLI. -->
    <link rel="stylesheet" href="./generated.css" />
    <style>
      html { background-color: #f7f5f2; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- A literal relative specifier: Bun finds the app by static analysis of this file. -->
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
