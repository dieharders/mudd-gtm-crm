# Build Mudd.io for Windows, macOS and Linux and attach the downloads to a DRAFT release: a zip
# for Windows and Linux, a .dmg installer for macOS.
#
# MANUALLY TRIGGERED. Nothing here runs on a push or a tag.
#
# HOW TO RUN IT: Actions -> Manual Release -> Run workflow. Pick the branch to build in the
# "Use workflow from" dropdown and type the release tag, e.g. v0.1.4. The tag must be "v" plus
# the version in package.json, so the version the app reports matches the release.
#
# The run drafts a release under that tag. Nobody sees it until you open it under Releases and
# press Publish, and publishing is what creates the tag, at the commit that was built. The draft
# is made only when all four builds succeed, so a failed run leaves nothing behind.
#
# Running again with the same tag replaces the downloads on that draft and moves it to the new
# commit. A tag whose release is already published is refused, and so is a tag that already
# exists at another commit: bump "version" in package.json and use the new tag.
#
# ONE RUNNER PER TARGET. Bun can cross-compile the executable, but webview-bun picks its native
# library by the platform it runs on, and the macOS build has to be codesigned on a Mac.
name: Manual Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag: v + the version in package.json (e.g. v0.1.4)"
        required: true
        type: string

# One run per tag at a time: two at once would each find no draft and each create one.
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  GH_REPO: ${{ github.repository }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # Checked before any build starts, so a mistyped tag or a forgotten version bump fails in
      # seconds rather than after four builds.
      - name: Check the tag
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          # Through the environment, not interpolated into the script: an input is user text.
          TAG: ${{ inputs.tag }}
        run: |
          version=$(jq -r .version package.json)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag '$TAG' does not match package.json (version $version). Use v$version, or change the version in package.json first."
            exit 1
          fi
          bash .github/scripts/check-release.sh
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-latest
            ext: zip
          - target: darwin-arm64
            runner: macos-latest # Apple silicon
            ext: dmg
          - target: darwin-x64
            # The last Intel macOS image; GitHub drops x86_64 macOS when macOS 15 retires (2027).
            runner: macos-15-intel
            ext: dmg
          - target: linux-x64
            runner: ubuntu-latest
            ext: zip
          # linux-arm64 is left out: arm64 Linux runners are free only for public repos.
          # To add it: `- target: linux-arm64 / runner: ubuntu-24.04-arm / ext: zip`.
    env:
      # scripts/make-installer.ts names the .dmg the same way.
      ASSET: Mudd.io-${{ needs.version.outputs.version }}-${{ matrix.target }}.${{ matrix.ext }}

    steps:
      - uses: actions/checkout@v4

      # Reads the version from package.json's packageManager field.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
          no-cache: true

      - run: bun install --frozen-lockfile

      - run: bun run build:css

      - run: bun run build.ts --target=${{ matrix.target }}

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/${{ matrix.target }}/Mudd.io.exe" -DestinationPath "dist/$env:ASSET"

      # The signed Mudd.io.app beside an Applications shortcut, to drag it onto.
      - name: Installer (macOS)
        if: runner.os == 'macOS'
        run: bun run installer --target=${{ matrix.target }}

      # Info-ZIP keeps the executable bit, so the unzipped binary runs without a chmod.
      - name: Zip (Linux)
        if: runner.os == 'Linux'
        run: zip -j "dist/$ASSET" "dist/${{ matrix.target }}/Mudd.io"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/${{ env.ASSET }}
          compression-level: 0
          if-no-files-found: error
          # Only a hand-off to the release job, which copies the files into the release.
          retention-days: 1

  release:
    name: draft release
    # `needs` the builds: one failed platform skips this job, so no partial draft is ever made.
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # Again, not just in the version job: "Re-run failed jobs" runs only this one, and the draft
      # may have been published since. Uploading then would replace a public release's downloads.
      - name: Check the tag
        id: check
        run: bash .github/scripts/check-release.sh

      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true

      # gh rather than a release action: GitHub's get-release-by-tag API does not return drafts,
      # so actions that rely on it create a second draft on every re-run instead of updating one.
      - name: Update the draft
        if: steps.check.outputs.release == 'draft'
        run: |
          # Point the draft at this commit, or publishing would tag the commit of an earlier run.
          gh release edit "$TAG" --target "$GITHUB_SHA"
          gh release upload "$TAG" downloads/* --clobber
          # Drop anything this run did not build (e.g. a zip from before macOS shipped as a .dmg).
          gh release view "$TAG" --json assets -q '.assets[].name' | while read -r name; do
            [ -e "downloads/$name" ] || gh release delete-asset "$TAG" "$name" --yes
          done

      - name: Create the draft
        if: steps.check.outputs.release == 'none'
        run: |
          cat > notes.md <<'EOF'
          Download the file for your platform. Your data is kept in `%APPDATA%\Mudd.io` (Windows)
          or `~/.mudd` (macOS, Linux), not beside the app, so replacing the app with a newer build
          keeps everything.

          - **Windows**: unzip and run `Mudd.io.exe`.
          - **macOS**: open the `.dmg` (`arm64` for Apple silicon, `x64` for Intel) and drag
            Mudd.io into Applications.
          - **Linux**: unzip and run `Mudd.io`. Needs GTK 4 and WebKitGTK 6.0
            (Debian/Ubuntu: `sudo apt install libgtk-4-1 libwebkitgtk-6.0-4`).
            `zenity` or `kdialog` adds the native file picker.

          **These builds are unsigned**, so the first launch shows a warning:

          - **Windows**: "Windows protected your PC" -> More info -> Run anyway.
          - **macOS**: open Mudd.io once from Applications, then
            System Settings -> Privacy & Security -> Open Anyway.
          EOF
          gh release create "$TAG" downloads/* \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Mudd.io $TAG" \
            --notes-file notes.md \
            --generate-notes
