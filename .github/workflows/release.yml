# Build Mudd for Windows, macOS and Linux and attach the downloads to a DRAFT release: a zip
# for Windows and Linux, a .dmg installer for macOS.
#
# MANUALLY TRIGGERED. Nothing here runs on a push or a tag.
#
# HOW TO RUN IT: Actions -> Manual Release -> Run workflow. Pick what to build in the
# "Use workflow from" dropdown (a branch, or a tag) and press Run. The release tag is "v" plus
# the version in that code's package.json (e.g. v0.1.4), so the version the app reports always
# matches the release. Picking a tag that isn't that version's tag is refused.
#
# The run drafts a release under that tag. Nobody sees it until you open it under Releases and
# press Publish, and publishing creates the tag at the commit that was built if it doesn't exist
# yet. The draft is made only when all four builds succeed, so a failed run leaves nothing behind.
#
# Running again for the same version replaces the downloads on that draft and moves it to the
# new commit. A version whose release is already published is refused, and so is one whose tag
# already exists at another commit: bump "version" in package.json and run again.
#
# ONE RUNNER PER TARGET. Bun can cross-compile the executable, but webview-bun picks its native
# library by the platform it runs on, and the macOS build has to be codesigned on a Mac.
name: Manual Release

on:
  workflow_dispatch:

# One release run at a time: two for the same version would each find no draft and each create
# one. (The version isn't known until package.json is read, so it can't name the group.)
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  GH_REPO: ${{ github.repository }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # Checked before any build starts, so a forgotten version bump fails in seconds rather
      # than after four builds.
      - name: Work out and check the tag
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version package.json)
          export TAG="v$version"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "::error::Run from tag $GITHUB_REF_NAME, but package.json there says version $version. Run from $TAG or from a branch."
            exit 1
          fi
          bash .github/scripts/check-release.sh
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG from $GITHUB_REF_NAME ($GITHUB_SHA)"

  build:
    name: ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-latest
            ext: zip
          - target: darwin-arm64
            runner: macos-latest # Apple silicon
            ext: dmg
          - target: darwin-x64
            # The last Intel macOS image; GitHub drops x86_64 macOS when macOS 15 retires (2027).
            runner: macos-15-intel
            ext: dmg
          - target: linux-x64
            runner: ubuntu-latest
            ext: zip
          # linux-arm64 is left out: arm64 Linux runners are free only for public repos.
          # To add it: `- target: linux-arm64 / runner: ubuntu-24.04-arm / ext: zip`.
    env:
      # scripts/make-installer.ts names the .dmg the same way.
      ASSET: Mudd-${{ needs.version.outputs.version }}-${{ matrix.target }}.${{ matrix.ext }}

    steps:
      - uses: actions/checkout@v4

      # Reads the version from package.json's packageManager field.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
          no-cache: true

      - run: bun install --frozen-lockfile

      - run: bun run build:css

      - run: bun run build.ts --target=${{ matrix.target }}

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/${{ matrix.target }}/Mudd.exe" -DestinationPath "dist/$env:ASSET"

      # The signed Mudd.app beside an Applications shortcut, to drag it onto.
      - name: Installer (macOS)
        if: runner.os == 'macOS'
        run: bun run installer --target=${{ matrix.target }}

      # Info-ZIP keeps the executable bit, so the unzipped binary runs without a chmod.
      - name: Zip (Linux)
        if: runner.os == 'Linux'
        run: zip -j "dist/$ASSET" "dist/${{ matrix.target }}/Mudd"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/${{ env.ASSET }}
          compression-level: 0
          if-no-files-found: error
          # Only a hand-off to the release job, which copies the files into the release.
          retention-days: 1

  release:
    name: draft release
    # `needs` the builds: one failed platform skips this job, so no partial draft is ever made.
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # Again, not just in the version job: "Re-run failed jobs" runs only this one, and the draft
      # may have been published since. Uploading then would replace a public release's downloads.
      - name: Check the tag
        id: check
        run: bash .github/scripts/check-release.sh

      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true

      # gh rather than a release action: GitHub's get-release-by-tag API does not return drafts,
      # so actions that rely on it create a second draft on every re-run instead of updating one.
      - name: Update the draft
        if: steps.check.outputs.release == 'draft'
        run: |
          # Point the draft at this commit, or publishing would tag the commit of an earlier run.
          gh release edit "$TAG" --target "$GITHUB_SHA"
          gh release upload "$TAG" downloads/* --clobber
          # Drop anything this run did not build, so the draft holds exactly this run's downloads.
          gh release view "$TAG" --json assets -q '.assets[].name' | while read -r name; do
            [ -e "downloads/$name" ] || gh release delete-asset "$TAG" "$name" --yes
          done

      - name: Create the draft
        if: steps.check.outputs.release == 'none'
        run: |
          cat > notes.md <<'EOF'
          Download the file for your platform. Your data is kept in `%APPDATA%\Mudd` (Windows)
          or `~/.mudd` (macOS, Linux), not beside the app, so replacing the app with a newer build
          keeps everything.

          - **Windows**: unzip and run `Mudd.exe`.
          - **macOS**: open the `.dmg` (`arm64` for Apple silicon, `x64` for Intel) and drag
            Mudd into Applications.
          - **Linux**: unzip and run `Mudd`. Needs GTK 4 and WebKitGTK 6.0
            (Debian/Ubuntu: `sudo apt install libgtk-4-1 libwebkitgtk-6.0-4`).
            `zenity` or `kdialog` adds the native file picker.

          **These builds are unsigned**, so the first launch shows a warning:

          - **Windows**: "Windows protected your PC" -> More info -> Run anyway.
          - **macOS**: open Mudd once from Applications, then
            System Settings -> Privacy & Security -> Open Anyway.
          EOF
          gh release create "$TAG" downloads/* \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Mudd $TAG" \
            --notes-file notes.md \
            --generate-notes
